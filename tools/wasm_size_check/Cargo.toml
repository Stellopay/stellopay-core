[package]
name = "wasm_size_check"
version = "0.1.0"
edition = "2021"
description = "WASM binary-size regression checker for StellopayCore Soroban contracts"
license = "MIT"
repository = "https://github.com/stellopay/stellopay-core"
publish = false

[[bin]]
name = "wasm_size_check"
path = "src/main.rs"

[lib]
name = "wasm_size_check"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", default-features = false }
thiserror = "1.0"
walkdir = "2.4"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = "thin"
