[package]
name = "multisig"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
rbac-interface = { path = "../rbac-interface" }
soroban-sdk = { workspace = true, features = ["alloc"] }

[dev-dependencies]
rbac = { path = "../rbac" }
soroban-sdk = { workspace = true, features = ["alloc", "testutils"] }

