name: Contracts CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installed via the preinstalled rustup rather than dtolnay/rust-toolchain:
      # fetching that action from codeload intermittently returns 429 and fails
      # the job during setup, before any of the checks below even run.
      - name: Install Rust (nightly)
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt
          rustup default nightly

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: onchain

      - name: Check formatting
        working-directory: onchain
        run: cargo fmt --all -- --check

      - name: Build workspace
        working-directory: onchain
        run: cargo build --workspace --verbose

      - name: Test workspace
        working-directory: onchain
        run: cargo test --workspace --verbose
