name: Contracts CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  list-crates:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: set-matrix
        working-directory: onchain
        run: |
          echo "matrix=$( \
            cargo metadata --format-version 1 --no-deps | \
            python3 -c "import json,sys;d=json.load(sys.stdin);print(json.dumps({'crate':sorted([p['name'] for p in d['packages'] if '/contracts/' in p['manifest_path']])}))" \
          )" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "onchain"

      - name: Check formatting
        working-directory: onchain
        run: cargo fmt --all -- --check

      - name: Build workspace
        working-directory: onchain
        run: cargo build --workspace --verbose

      - name: Run workspace tests
        working-directory: onchain
        run: cargo test --workspace --verbose

  coverage:
    needs: [list-crates, lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.list-crates.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "onchain"

      - name: Generate coverage for ${{ matrix.crate }}
        working-directory: onchain
        run: cargo llvm-cov -p ${{ matrix.crate }} --json --output-path coverage.json

      - name: Check coverage >= 95%
        run: python3 .github/scripts/check_coverage.py --crate ${{ matrix.crate }} onchain/coverage.json
