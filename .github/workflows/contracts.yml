name: Contracts CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: onchain

      - name: Check formatting
        working-directory: onchain
        run: cargo fmt --all -- --check

      - name: Build workspace
        working-directory: onchain
        run: cargo build --workspace --verbose

      - name: Test workspace
        working-directory: onchain
        run: cargo test --workspace --verbose

      # -----------------------------------------------------------------
      # WASM binary-size regression check (issue #949)
      # -----------------------------------------------------------------
      # This step builds every Soroban contract in the `onchain`
      # workspace to `wasm32-unknown-unknown --release` and compares
      # the produced `.wasm` sizes against the committed baseline in
      # `benchmarks/wasm_sizes.json`. The job fails if any contract's
      # size grew beyond the configured tolerance without a matching
      # baseline refresh in the same PR.
      #
      # See `tools/wasm_size_check/README.md` and `docs/ci.md` for the
      # full policy and the bootstrap / refresh flow.

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build contracts to wasm32-unknown-unknown
        working-directory: onchain
        run: |
          cargo build --workspace \
            --release \
            --target wasm32-unknown-unknown \
            --verbose

      - name: Run wasm_size_check
        run: |
          mkdir -p artifacts
          cargo run --release --manifest-path tools/wasm_size_check/Cargo.toml -- \
            --baseline  benchmarks/wasm_sizes.json \
            --wasm-dir  onchain/target/wasm32-unknown-unknown/release \
            --tolerance-pct 5 \
            --fail-on-new \
            --report artifacts/wasm_size_report.md

      - name: Upload size report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-size-report
          path: artifacts/wasm_size_report.md
          if-no-files-found: warn
