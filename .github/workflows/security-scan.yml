name: Security Scan — Semver Checks

on:
  schedule:
    # Weekly Monday 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  semver-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: onchain

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      - name: Collect contract crate manifests
        id: crates
        run: |
          cd onchain
          manifests=()
          for m in contracts/*/Cargo.toml; do
            crate=$(basename "$(dirname "$m")")
            manifests+=("{\"name\":\"$crate\",\"manifest\":\"$m\"}")
          done
          # Build JSON array
          first=1
          echo -n 'crates=[' >> "$GITHUB_OUTPUT"
          for entry in "${manifests[@]}"; do
            if [ $first -eq 1 ]; then first=0; else echo -n ',' >> "$GITHUB_OUTPUT"; fi
            echo -n "$entry" >> "$GITHUB_OUTPUT"
          done
          echo ']' >> "$GITHUB_OUTPUT"

      - name: Run semver checks per contract crate
        run: |
          cd onchain
          failures=0
          for manifest in contracts/*/Cargo.toml; do
            crate_dir=$(dirname "$manifest")
            crate_name=$(basename "$crate_dir")
            version=$(grep '^version = ' "$manifest" | head -1 | sed 's/.*"\(.*\)".*/\1/')
            tag="${crate_name}-v${version}"

            echo "::group::[$crate_name] semver-checks (version=$version, tag=$tag)"

            # Run semver-checks using git-based baseline comparison.
            # When a release tag exists (e.g. stello_pay_contract-v0.1.0),
            # the tool compares the current API against that tagged release.
            # Without a tag the check is skipped (first release).
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null 2>&1; then
              if cargo semver-checks check-release \
                -p "$crate_name" \
                --manifest-path "$manifest" \
                --baseline-rev "$tag" \
                --verbose; then
                echo "::notice title=$crate_name::No breaking changes detected against $tag"
              else
                echo "::error title=$crate_name::Breaking change detected! Either bump the version or revert the API change."
                failures=$((failures + 1))
              fi
            else
              echo "::notice title=$crate_name::No tag $tag found — skipping (first release / unreleased). Tag the first release with \`git tag $tag\` to enable checking."
            fi

            echo "::endgroup::"
          done

          if [ $failures -gt 0 ]; then
            echo "::error::$failures crate(s) have breaking API changes without a version bump."
            exit 1
          fi
          echo "::notice::All semver checks passed."
